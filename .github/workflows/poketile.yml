name: PokéTile updates

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
concurrency:
  group: poketile-check
  cancel-in-progress: false
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install playwright requests
          python -m playwright install --with-deps chromium

      - name: Comprobar PokéTile y publicar si hay novedades
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: python check_poketile.py

        - name: Guardar versión comprobada
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state.json
          if git diff --cached --quiet; then
            echo "Sin cambios en state.json"
            exit 0
          fi
          git commit -m "Actualizar versión comprobada de PokéTile"
          git pull --rebase origin main
          git push origin main
